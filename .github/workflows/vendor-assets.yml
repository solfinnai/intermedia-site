name: Vendor public assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.event.head_commit.message != 'Add vendored public assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch brand, team, and media files
        run: node scripts/fetch-assets.mjs
      - name: Commit assets if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Add vendored public assets"
            git push
          fi
