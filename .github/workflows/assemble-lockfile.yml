name: Assemble package-lock.json
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-lockfile.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate lockfile parts and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat lock-b64/part-* | base64 -d | gzip -d > package-lock.json
          test "$(wc -c < package-lock.json)" -eq 344363
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "69710e4bb8d9885bdb81b97e7ed09b837105adfec1063374c5ff224fef31f0ba"
          git add package-lock.json
          git rm -r lock-b64
          git rm .github/workflows/assemble-lockfile.yml
          git commit -m "Add package-lock.json"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 4))
          done
          exit 1
